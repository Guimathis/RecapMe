server:
  port: 8080

spring:
  application:
    name: recapme-backend
  config:
    import: optional:file:./backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recapme-db}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    cache-names:
      - search-medias
      - media-details
      - season-recaps
      - home-sections
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m,recordStats

  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_APIKEY}
        chat:
          model: gemini-3.5-flash-lite

recapme:
  anilist:
    endpoint: ${ANILIST_GRAPHQL_URL:https://graphql.anilist.co}
  kitsu:
    endpoint: ${KITSU_GRAPHQL_URL:https://kitsu.app/api/graphql}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    doc-expansion: list

logging:
  level:
    root: INFO
    com.recapme: DEBUG