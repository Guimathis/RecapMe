server:
  port: 8080

spring:
  application:
    name: recapme-backend
  config:
    import: optional:file:./backend/.env[.properties]
  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    cache-names:
      - search-medias
      - media-details
      - season-recaps
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m

  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_APIKEY}
        chat:
          model: gemini-3.5-flash-lite
#    openai:
#      api-key: ${OPENAI_API_KEY:demo-key}
#      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
#      chat:
#        options:
#          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
#          temperature: 0.7

recapme:
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-key: ${TMDB_API_KEY:}
  jikan:
    base-url: https://api.jikan.moe/v4
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    doc-expansion: list

logging:
  level:
    root: INFO
    com.recapme: DEBUG
    org.springframework.ai: INFO
